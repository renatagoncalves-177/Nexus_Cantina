<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do aluno - Nexus Cantina</title>
    <link rel="stylesheet" href="../static/css/login.css">
    <script src="../static/js/login.js" defer></script>
</head>
<body>
    <main class="container-login">
        <section class="card-login" aria-labelledby="tituloLogin">
            <a href="escolhausuario.html" class="voltar-perfil">← Escolher outro perfil</a>
            <header class="logo-area">
                <div class="logo" aria-hidden="true">CANTINA</div>
                <h1 id="tituloLogin">Login do aluno</h1>
                <p>Acesse sua conta para fazer seus pedidos.</p>
            </header>

            <form id="formLogin" data-tipo="aluno" data-destino="telaaluno.html">
                <div class="campo">
                    <label for="identificador">Matrícula</label>
                    <input type="text" id="identificador" name="matricula" placeholder="Digite sua matrícula"
                        autocomplete="username" required minlength="3" maxlength="30">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="senha-linha">
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha"
                            autocomplete="current-password" required maxlength="128">
                        <button type="button" class="mostrar-senha" data-mostrar-senha aria-controls="senha" aria-pressed="false">Mostrar</button>
                    </div>
                </div>

                <button type="submit" class="botao-login" data-botao-login>Entrar</button>
                <p id="mensagemLogin" class="mensagem" role="status" aria-live="polite" hidden></p>
            </form>

            <footer class="rodape-login">Nexus Cantina • Área do aluno</footer>
        </section>
    </main>
</body>
</html>
