<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/alertapagamento.css">
    <title>Nexus Cantina - Pedido realizado</title>
</head>

<body data-perfis="aluno,responsavel">
    <main class="confirmacao-pagina">
        <section class="confirmacao-card">
            <div class="icone-sucesso" id="iconePedido" aria-hidden="true">✓</div>
            <span class="etiqueta" id="statusPedido">PEDIDO CONFIRMADO</span>
            <h1 id="tituloPedido">Seu pedido foi realizado!</h1>
            <p class="mensagem-principal" id="mensagemPedido">
                Agora é só retirar seu pedido na cantina no intervalo escolhido.
            </p>

            <div class="detalhes-pedido">
                <div>
                    <span>Intervalo</span>
                    <strong id="intervaloConfirmado">Não informado</strong>
                </div>
                <div>
                    <span>Total</span>
                    <strong id="totalConfirmado">R$ 0,00</strong>
                </div>
                <div>
                    <span>Saldo após o pedido</span>
                    <strong id="saldoConfirmado">—</strong>
                </div>
            </div>

            <p class="aviso-dia-seguinte" id="avisoPedido" role="status" aria-live="polite">
                Você pode alterar ou cancelar este pedido enquanto ele não estiver concluído.
            </p>

            <div class="acoes" id="acoesPedido">
                <button type="button" id="alterarPedido" class="botao-secundario">Alterar pedido</button>
                <button type="button" id="cancelarPedido" class="botao-perigo">Cancelar pedido</button>
                <a href="telaaluno.html" class="botao-principal" data-inicio-perfil>Voltar ao início</a>
            </div>
        </section>
    </main>

    <script src="../static/js/gestao-dados.js"></script>
    <script src="../static/js/alertapagamento.js"></script>
    <script src="../static/js/navegacao-perfil.js"></script>
</body>
</html>
